<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>Edit Parking Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"rel="stylesheet">
</head>
<body style="background-color:#eabfff;">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand"href="{{url_for('dashboard.dashboard')}}"style="font-weight:bold;font-size:30px;color:blueviolet;">Admin Panel</a>
    </div>
</nav>
<span></span>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card"style="background-color:rgb(190, 144, 233);">
                <div class="card-header text-center">
                    <h3>Edit Parking Lot: {{lot.prime_location_name}}</h3>
                </div>
                <div class="card-body"style="background-color:rgb(223, 194, 250);border:0.005em solid black;">
                    <form action="{{url_for('admin.edit_lot', lid=lot.id)}}"method="POST">
                        <div class="mb-4">
                            <label style="font-weight:bold;"for="prime_location_name"class="form-label">Location Name</label>
                            <input name="prime_location_name"type="text"class="form-control"id="prime_location_name"value="{{lot.prime_location_name}}"required>
                        </div>
                        <div class="row">
                            <div class="col-md-8 mb-4">
                                <label for="price"style="font-weight:bold;"class="form-label">Price per Hour</label>
                                <input type="number"step="0.01"value="{{lot.price}}"class="form-control"id="price"name="price"required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="address"class="form-label"style="font-weight:bold;">Full Address</label>
                            <input id="address"type="text"class="form-control"name="address"value="{{lot.address}}"required>
                        </div>
                        <div class="mb-4">
                            <label style="font-weight:bold;"for="pin_code"class="form-label">Pin Code</label>
                            <input id="pin_code"name="pin_code"value="{{lot.pin_code}}"type="text"class="form-control"required>
                        </div>
                        <a href="{{url_for('dashboard.dashboard')}}"class="btn btn-secondary"style="font-weight:bold;">Cancel</a>
                        <button style="font-weight:bold;background-color:rgb(190, 144, 250);"type="submit"class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
