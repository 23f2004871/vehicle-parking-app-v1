{% extends "admin/admin_layout.html"%}

{% block title %}Add Parking Lot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-12"style="">
        <div class="card">
            <div class="card-header text-center"style="background-color:rgb(190, 144, 233);">
                <h2>Add New Parking Lot</h3>
            </div>
            <div class="card-body"style="background-color:rgb(223, 194, 250);border:0.005em solid black;">
                <form action="{{url_for('admin.add_lot')}}"method="POST">

                    <div class="mb-4">
                        <label for="pln"class="form-label"style="font-weight:bold;">Location Name</label>
                        <input type="text"class="form-control"placeholder="Enter the Location please...."id="pln"name="prime_location_name"required>
                    </div>

                    <div class="mb-4">
                        <label for="a"style="font-weight:bold;"class="form-label">Full Address</label>
                        <input placeholder="Enter the Full Address please...."type="text"class="form-control"id="a"name="address"required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label style="font-weight:bold;"for="c"class="form-label">City</label>
                            <input type="text"class="form-control"id="c"name="city"placeholder="Enter the City please...."value="Chennai">
                        </div>

                        <div class="col-md-6 mb-4">
                            <label for="s"style="font-weight:bold;"class="form-label">State</label>
                            <input placeholder="Enter the State please...."type="text"class="form-control"id="s"name="state"value="Tamil Nadu">
                        </div>

                        <div class="col-md-6 mb-4">
                            <label for="pc"class="form-label"style="font-weight:bold;">Pin Code</label>
                            <span></span>
                            <input type="text"class="form-control"id="pc"name="pin_code"required placeholder="Enter the Pincode please....">
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="lt"style="font-weight:bold;"class="form-label">Latitude</label>
                            <input type="text"class="form-control"id="lt"name="lat"placeholder="e.g., 13.0827">
                            <div class="form-text">For map display</div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label style="font-weight:bold;"for="ln"class="form-label">Longitude</label>
                            <input type="text"class="form-control"id="ln"name="lon"placeholder="e.g., 80.2707">
                            <div class="form-text">For map display</div>
                        </div>

                    </div>
                    
                    <div class="row">
                         <div class="col-md-4 mb-3">
                            <label for="p"class="form-label"style="font-weight:bold;">Price per Hour (₹)</label>
                            <input type="number"step="0.01"class="form-control"id="p"required placeholder="Enter the price/hr please...."name="price"required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="o"class="form-label"style="font-weight:bold;">Opening Time</label style="font-weight:bold;">
                            <input type="time"class="form-control"id="o"name="opening">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="cl"class="form-label"style="font-weight:bold;">Closing Time</label style="font-weight:bold;">
                            <input type="time"class="form-control"id="cl"name="closing">
                        </div>
                    </div>

                     <div class="mb-4">
                        <label style="font-weight:bold;"for="am"class="form-label">Amenities</label>
                        <input type="text"class="form-control"id="am"name="amenities"placeholder="e.g., CCTV, Security, Car Wash, Valet">
                        <div class="form-text">Comma-separated list of available amenities</div>
                    </div>

                    <div class="mb-4">
                        <label for="lv"style="font-weight:bold;"class="form-label">Parking Levels</label>
                        <input type="text"class="form-control"id="lv"name="levels"placeholder="e.g., G, B1, B2">
                        <div class="form-text">Enter levels comma-separated....Spots will be distributed among them...</div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-8">
                            <div class="form-check">
                                <input class="form-check-input"type="checkbox"id="hev"name="has_ev_support">
                                <label class="form-check-label"for="hev"style="font-weight:bold;">
                                    Include EV Charging Spots (10% of total)
                                </label>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="form-check">
                                <input class="form-check-input"type="checkbox"id="hps"name="has_premium_spots">
                                <label class="form-check-label"for="hps"style="font-weight:bold;">
                                    Include Premium Spots (10% of total, 1.5x price)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="mnos"class="form-label"style="font-weight:bold;">Total Number of Spots</label>
                        <input type="number"class="form-control"id="mnos"name="maximum_number_of_spots"required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{url_for('admin.admin_dashboard')}}"class="btn btn-secondary"style="font-weight:bold;">Cancel</a>
                        <button type="submit"class="btn btn-primary"style="font-weight:bold;background-color:rgb(190, 144, 250);">Create Parking Lot</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
